[project]
name = "nostalgia-assets-scripts"
version = "0.1.0"
description = "Utility scripts for the nostalgia-assets image catalogs."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
  "cairosvg>=2.9.1",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
